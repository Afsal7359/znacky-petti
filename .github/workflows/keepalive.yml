name: Daily keep-alive

# Pings the website and the Supabase database once a day so the free tier
# never pauses the project. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 11:30 AM IST, every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping website + database
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/keepalive.mjs
